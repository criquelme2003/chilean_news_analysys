name: DAILY SCRAPPING
on:
  push:
    branches:
      - 'master'
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  # Backup y scraping en un solo job: antes eran dos jobs y el segundo hacía
  # checkout del commit original, quedando detrás del commit del backup y
  # fallando el push con "non-fast-forward".
  scapping-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Create a copy of database
        run: mkdir -p backups && cp DB/noticias.db "backups/$(date +%F)noticias.db"

      # Se ordena por nombre (prefijo YYYY-MM-DD) y no por mtime, porque el
      # checkout deja a todos los archivos con la misma fecha de modificación.
      - name: keep 10 last backups only
        run: ls -1 backups/*noticias.db | sort -r | tail -n +11 | xargs -r rm -f

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip' # caching pip dependencies
      - run: pip install -r requirements.txt

      - name: SCRAPPING
        run: python -m scrapping.extract_schema

      - run: python -m scrapping.modular_sites.biobiochile
      - run: python -m scrapping.modular_sites.diario_financiero
      - run: python -m scrapping.modular_sites.la_nacion
      - run: python -m scrapping.modular_sites.the_clinic

      - uses: stefanzweifel/git-auto-commit-action@v7
