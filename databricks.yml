# This is a Declarative Automation Bundle definition for chilean_news_analysis.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: chilean_news_analysis
  uuid: 4e018b9d-3297-4a1b-9066-b52ffc9010a0

include:
  - chilean_new_analysis/resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

resources:
  catalogs:
    chilean_news:
      name: "chilean_news"
      comment: "Catalogo de chilean news "


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-003756d5-7338.cloud.databricks.com
    variables:
      catalog: chilean_news
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-003756d5-7338.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/carlitisamuel@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/carlitisamuel@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: chilean_news
      schema: prod
    permissions:
      - user_name: carlitisamuel@gmail.com
        level: CAN_MANAGE
